<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World Front 世界戰線</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#050b12;color:#d7e0ea;font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;font-size:13px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100%}
#topbar{height:42px;background:#0d151d;border-bottom:1px solid #1c2836;display:flex;align-items:center;gap:14px;padding:0 12px;flex-shrink:0;font-size:12px}
#topbar .brand{font-weight:700;letter-spacing:2px;color:#5fb0ff}
#topbar b{color:#fff}
#topbar .sp{flex:1}
button{background:#1b2734;color:#cfe0f0;border:1px solid #2c3d50;border-radius:4px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;touch-action:manipulation}
button:hover{background:#24374a;border-color:#3d5872}
button:active{transform:translateY(1px)}
button.pri{background:#1d4f7c;border-color:#2e79b8;color:#dff0ff}
button.pri:hover{background:#25679d}
button.danger{background:#5c2323;border-color:#8a3838}
#main{flex:1;display:flex;min-height:0}
#sidebar{width:320px;background:#0a1017;border-right:1px solid #1c2836;overflow-y:auto;padding:8px;flex-shrink:0}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:#233140;border-radius:3px}
#canvasWrap{flex:1;position:relative;min-width:0;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
#log{height:84px;background:#050a0e;border-top:1px solid #1c2836;padding:5px 12px;overflow-y:auto;font-size:11px;font-family:ui-monospace,monospace;color:#7d93a8;flex-shrink:0;line-height:1.5}
#log::-webkit-scrollbar{width:6px}
#log::-webkit-scrollbar-thumb{background:#1e2b38}
.log-warn{color:#ff9f5a}
.log-bad{color:#ff6b6b}
.log-good{color:#5fd08a}
.sec{margin-bottom:9px;background:#0d161f;border:1px solid #1b2836;border-radius:5px;overflow:hidden}
.sec-title{padding:5px 9px;background:#12202c;font-size:11px;letter-spacing:1px;color:#7fa8cc;border-bottom:1px solid #1b2836;font-weight:600}
.sec-body{padding:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 0}
.eq-row{display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:1px solid #16202b;font-size:11px}
.eq-row:last-child{border-bottom:none}
.eq-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-cnt{color:#6fc4ff;font-weight:700;min-width:26px;text-align:right}
.mini{padding:1px 5px;font-size:10px;border-radius:3px;line-height:1.5}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.shop-btn{text-align:left;padding:4px 6px;font-size:10px;line-height:1.35;position:relative}
.shop-btn .c{color:#ffd166;float:right}
.shop-btn .n{display:block;color:#c9dcee}
.shop-btn.dis{opacity:.38;cursor:not-allowed}
.army-item{padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;font-size:11px;border:1px solid transparent}
.army-item:hover{background:#16222e}
.army-item.sel{background:#173347;border-color:#2f78ad}
.army-item .fac{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.army-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.army-item .sz{color:#7d93a8;font-size:10px}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:#1c2a38;color:#8fb5d6}
.tag.p{background:#12395c;color:#7cc4ff}
.tag.a1{background:#4a1a1a;color:#ff9a9a}
.tag.a2{background:#4a3612;color:#ffc46b}
.tag.n{background:#242e38;color:#9aa8b5}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="brand">WORLD FRONT</span>
    <span>資源 <b id="uiRes">0</b></span>
    <span>Tick <b id="uiTick">0</b></span>
    <span>領土 <b id="uiNodes">0</b></span>
    <span id="uiStatus"></span>
    <span class="sp"></span>
    <button id="btnPause">暫停</button>
    <button id="btnNew" class="danger">新遊戲</button>
  </div>
  <div id="main">
    <div id="sidebar">
      <div class="sec"><div class="sec-title">我的軍隊</div><div class="sec-body" id="armyList"></div></div>
      <div class="sec"><div class="sec-title">選中部隊 / 節點</div><div class="sec-body" id="selPanel"></div></div>
      <div class="sec"><div class="sec-title">兵工廠（點擊加入選中部隊）</div><div class="sec-body"><div class="shop-grid" id="shop"></div></div></div>
      <div class="sec"><div class="sec-title">操作</div><div class="sec-body" style="font-size:11px;line-height:1.7;color:#7d93a8">
        單指拖動畫布平移<br>
        雙指捏合縮放地圖<br>
        輕點節點/軍隊選中<br>
        選中部隊後點相鄰節點移動<br>
        同節點另一支己方部隊＝合併
      </div></div>
    </div>
    <div id="canvasWrap"><canvas id="cv"></canvas></div>
  </div>
  <div id="log"></div>
</div>

/* ============================================================
   工具
   ============================================================ */
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function bboxOf(pts){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const [x,y] of pts){
    if(x<minX)minX=x; if(y<minY)minY=y;
    if(x>maxX)maxX=x; if(y>maxY)maxY=y;
  }
  return {minX,minY,maxX,maxY};
}
function pointInPoly(px,py,poly){
  let inside=false;
  const pts=poly.pts, n=pts.length;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=pts[i][0], yi=pts[i][1];
    const xj=pts[j][0], yj=pts[j][1];
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)){
      inside = !inside;
    }
  }
  return inside;
}
function pointInLand(px,py,land){
  for(const poly of land){
    const b=poly.bbox;
    if(px<b.minX||px>b.maxX||py<b.minY||py>b.maxY) continue;
    if(pointInPoly(px,py,poly)) return true;
  }
  return false;
}
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ============================================================
   地圖生成
   ============================================================ */
function buildLand(){
  const XS = WORLD;
  const YS = WORLD * 0.67;
  const OFFSET_Y = (WORLD - YS) / 2;
  return LAND_RAW.map(p=>{
    const pts = p.pts.map(([x,y])=>[x*XS, y*YS + OFFSET_Y]);
    return {name:p.name, label:p.label||'', pts, bbox:bboxOf(pts)};
  });
}

function buildMap(){
  const land = buildLand();
  const GRID_COLS = 80;
  const GRID_ROWS = 60;
  let cand = [];
  
  for(let r=0; r<GRID_ROWS; r++){
    for(let c=0; c<GRID_COLS; c++){
      const wx = (c + 0.5) * (WORLD / GRID_COLS);
      const wy = (r + 0.5) * (WORLD / GRID_ROWS);
      if(pointInLand(wx, wy, land)){
        const jx = (Math.random() - 0.5) * (WORLD / GRID_COLS) * 0.6;
        const jy = (Math.random() - 0.5) * (WORLD / GRID_ROWS) * 0.6;
        cand.push({ wx: wx + jx, wy: wy + jy });
      }
    }
  }
  
  for(let i=cand.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [cand[i],cand[j]] = [cand[j],cand[i]];
  }
  
  let chosen = [];
  const minD = (WORLD / GRID_COLS) * 0.85;
  for (let p of cand) {
    let ok = true;
    for (let q of chosen) {
      let d = Math.hypot(p.wx - q.wx, p.wy - q.wy);
      if (d < minD) { ok = false; break; }
    }
    if (ok) chosen.push(p);
    if (chosen.length >= TARGET_NODES) break;
  }
  
  if (chosen.length < TARGET_NODES) {
    for (let p of cand) {
      if (chosen.includes(p)) continue;
      chosen.push(p);
      if (chosen.length >= TARGET_NODES) break;
    }
  }
  
  const nodes = chosen.map((p, i) => {
    return {
      id: i,
      wx: p.wx,
      wy: p.wy,
      owner: 'neutral',
      terrain: 'plain',
      income: 4,
      defBonus: 0.05,
      name: ''
    };
  });
  
  for(const n of nodes){
    const rv = Math.random();
    if(rv > 0.86){ n.terrain='city'; n.income=7; n.defBonus=0.20; }
    else if(rv > 0.62){ n.terrain='mountain'; n.income=2; n.defBonus=0.32; }
    else if(rv > 0.36){ n.terrain='coast'; n.income=4; n.defBonus=-0.08; }
    else { n.terrain='plain'; n.income=4; n.defBonus=0.05; }
    n.name = makeNodeName(n);
  }
  
  const adj = nodes.map(()=>[]);
  const addEdge = (a,b)=>{
    if(a===b) return;
    if(!adj[a].includes(b)) adj[a].push(b);
    if(!adj[b].includes(a)) adj[b].push(a);
  };
  
  for(let i=0;i<nodes.length;i++){
    const dists = [];
    for(let j=0;j<nodes.length;j++){
      if(i===j) continue;
      const dx=nodes[i].wx-nodes[j].wx, dy=nodes[i].wy-nodes[j].wy;
      dists.push({j, d: Math.hypot(dx,dy)});
    }
    dists.sort((a,b)=>a.d-b.d);
    for(let k=0;k<Math.min(3,dists.length);k++){
      addEdge(i, dists[k].j);
    }
  }
  
  fixConnectivity(nodes, adj, addEdge);
  return {nodes, adj, land};
}

function fixConnectivity(nodes, adj, addEdge){
  for(let guard=0; guard<400; guard++){
    const seen = new Array(nodes.length).fill(false);
    const comps = [];
    for(let i=0;i<nodes.length;i++){
      if(seen[i]) continue;
      const q=[i]; seen[i]=true; const comp=[];
      while(q.length){
        const k=q.pop(); comp.push(k);
        for(const j of adj[k]) if(!seen[j]){ seen[j]=true; q.push(j); }
      }
      comps.push(comp);
    }
    if(comps.length<=1) return;
    comps.sort((a,b)=>b.length-a.length);
    let best=null, bd=Infinity;
    for(let ci=1;ci<comps.length;ci++){
      for(const i of comps[ci]){
        for(const j of comps[0]){
          const dx=nodes[i].wx-nodes[j].wx, dy=nodes[i].wy-nodes[j].wy;
          const d = dx*dx+dy*dy;
          if(d<bd){ bd=d; best=[i,j]; }
        }
      }
    }
    if(!best) return;
    addEdge(best[0], best[1]);
  }
}

const NAME_A = ['北','南','東','西','中','上','下','新','舊','海','山','河','湖','冰','沙','森','原','谷','港','關'];
const NAME_B = ['京','城','港','灣','原','嶺','谷','要塞','鎮','郡','州','島','口','關','壩','丘','川','澤','壘','站'];
function makeNodeName(n){
  const a = NAME_A[Math.floor(Math.random()*NAME_A.length)];
  const b = NAME_B[Math.floor(Math.random()*NAME_B.length)];
  return a+b;
}

/* ============================================================
   新遊戲
   ============================================================ */
function newGame(){
  const {nodes, adj, land} = buildMap();
  state = {
    tick:0,
    res:{player:160, ai1:160, ai2:160},
    nodes, adj, land,
    armies:[],
    nextArmyId:1,
    capitals:{},
    supply:{player:new Set(), ai1:new Set(), ai2:new Set()},
    selArmy:null, selNode:null,
    gameOver:null,
  };
  logLines = [];
  assignFactions();
  computeSupply();
  updateCameraToPlayer();
  saveGame();
  log('新遊戲開始。已生成 '+nodes.length+' 個戰略節點。', 'good');
}

function nearestNode(nx, ny){
  let bi=0, bd=Infinity;
  state.nodes.forEach((n,i)=>{
    const d = (n.wx/WORLD-nx)**2 + (n.wy/WORLD-ny)**2;
    if(d<bd){ bd=d; bi=i; }
  });
  return bi;
}

function assignFactions(){
  const s = state;
  const seeds = {
    player: nearestNode(0.18, 0.25),
    ai1: nearestNode(0.52, 0.22),
    ai2: nearestNode(0.75, 0.28),
  };
  const used = new Set();
  for(const f of PLAYABLE){
    let idx = seeds[f];
    if(used.has(idx)){
      for(const nb of s.adj[idx]){ if(!used.has(nb)){ idx = nb; break; } }
    }
    used.add(idx);
    s.capitals[f] = idx;
  }
  for(const f of PLAYABLE){
    const cap = s.capitals[f];
    s.nodes[cap].owner = f;
    s.nodes[cap].income = Math.max(s.nodes[cap].income, 6);
    for(const nb of s.adj[cap]) s.nodes[nb].owner = f;
  }
  for(const f of PLAYABLE){
    const cap = s.capitals[f];
    createArmy(f, cap, {rifle:6, mg:2, mbt:1}, FAC_NAME[f]+'第1連');
  }
}

function updateCameraToPlayer(){
  const cap = state.nodes[state.capitals.player];
  cam.x = cap.wx; cam.y = cap.wy; cam.zoom = 0.65;
}

/* ============================================================
   軍隊
   ============================================================ */
function createArmy(faction, nodeId, eq, name){
  const a = {
    id: state.nextArmyId++,
    faction, node: nodeId,
    from:null, to:null, prog:0,
    eq: Object.assign({}, eq),
    name: name || autoName(faction),
  };
  state.armies.push(a);
  return a;
}

const CNT_A = ['第','新編','獨立','機動','突擊','守備','快速','重裝','輕裝','合成'];
const CNT_B = ['連','營','團','旅','師','軍','支隊','縱隊','集群','戰鬥群'];
function autoName(faction){
  const n = state.armies.filter(x=>x.faction===faction).length + 1;
  const a = CNT_A[Math.floor(Math.random()*CNT_A.length)];
  const b = CNT_B[Math.floor(Math.random()*CNT_B.length)];
  return `${FAC_NAME[faction]}·${a}${b}${n}`;
}

function mergeCompList(arr){
  const c={inf:0,arm:0,air:0,sup:0};
  for(const a of arr) for(const k in a.eq){ if(a.eq[k]>0) c[EQ[k].type] += a.eq[k]; }
  return c;
}
function armyValue(a){ let v=0; for(const k in a.eq) v += a.eq[k]*EQ[k].cost; return v; }
function armyUnits(a){ let n=0; for(const k in a.eq) n += a.eq[k]; return n; }

function powerAgainst(a, ec, defBonus, supplied){
  const tot = (ec.inf+ec.arm+ec.air+ec.sup) || 1;
  const ri=ec.inf/tot, ra=ec.arm/tot, rr=ec.air/tot;
  let p = 0;
  for(const k in a.eq){
    const n = a.eq[k]; if(n<=0) continue;
    const e = EQ[k];
    p += n * (e.I*ri + e.A*ra + e.AA*rr);
  }
  return p * (1+defBonus) * (supplied ? 1 : 0.45);
}

function applyDamage(a, amount){
  let d = amount, guard = 0;
  while(d > 0 && guard++ < 800){
    const keys = Object.keys(a.eq).filter(k=>a.eq[k]>0);
    if(!keys.length) break;
    const k = keys[Math.floor(Math.random()*keys.length)];
    a.eq[k]--;
    d -= EQ[k].cost;
    if(a.eq[k] <= 0) delete a.eq[k];
  }
}

function armyPos(a){
  if(a.from==null){
    const n = state.nodes[a.node];
    return [n.wx, n.wy];
  }
  const A = state.nodes[a.from], B = state.nodes[a.to];
  return [A.wx + (B.wx-A.wx)*a.prog, A.wy + (B.wy-A.wy)*a.prog];
}

/* ============================================================
   補給
   ============================================================ */
function computeSupply(){
  const s = state;
  const out = {};
  for(const f of PLAYABLE){
    const cap = s.capitals[f];
    const seen = new Set();
    if(cap!=null && s.nodes[cap] && s.nodes[cap].owner===f){
      seen.add(cap);
      const q = [cap];
      while(q.length){
        const id = q.pop();
        for(const nb of s.adj[id]){
          if(!seen.has(nb) && s.nodes[nb].owner===f){ seen.add(nb); q.push(nb); }
        }
      }
    }
    out[f] = seen;
  }
  return out;
}
function isSupplied(a){
  const set = state.supply[a.faction];
  return set ? set.has(a.node) : false;
}

/* ============================================================
   Tick
   ============================================================ */
function doTick(){
  const s = state;
  if(!s || s.gameOver) return;
  s.tick++;

  for(const a of s.armies){
    if(a.from==null) continue;
    const spd = SPEED_BASE / (1 + armyValue(a)/420);
    a.prog += spd;
    if(a.prog >= 1){
      a.node = a.to; a.from=null; a.to=null; a.prog=1;
    }
  }

  for(const nd of s.nodes){
    const arr = s.armies.filter(a=>a.from==null && a.node===nd.id);
    if(!arr.length) continue;
    const facs = new Set(arr.map(a=>a.faction));
    if(facs.size===1){
      const f = arr[0].faction;
      if(nd.owner !== f){
        const was = nd.owner;
        nd.owner = f;
        if(f==='player') log(`佔領 ${nd.name}。`, 'good');
        else if(was==='player') log(`失去 ${nd.name}！`, 'bad');
      }
    }
  }

  resolveCombat();

  s.supply = computeSupply();
  for(const f of PLAYABLE){
    let inc = 0;
    for(const nd of s.nodes){
      if(nd.owner===f && s.supply[f].has(nd.id)) inc += nd.income;
    }
    s.res[f] += inc;
  }

  if(s.tick % 3 === 0){ aiTurn('ai1'); aiTurn('ai2'); }
  if(s.tick % 9 === 0){ aiMove('ai1'); aiMove('ai2'); }

  checkEnd();
  if(s.tick % 10 === 0) saveGame();
}

/* ============================================================
   戰鬥
   ============================================================ */
function resolveCombat(){
  const s = state;
  const byNode = {};
  for(const a of s.armies){
    if(a.from!=null) continue;
    (byNode[a.node] ||= []).push(a);
  }
  for(const nid in byNode){
    const arr = byNode[nid];
    const facs = [...new Set(arr.map(a=>a.faction))];
    if(facs.length < 2) continue;
    const nd = s.nodes[nid];
    const groups = {};
    for(const a of arr) (groups[a.faction] ||= []).push(a);
    const compOf = {};
    for(const f of facs) compOf[f] = mergeCompList(groups[f]);
    const dmg = {};
    for(const f of facs) dmg[f] = 0;
    for(const f of facs){
      for(const g of facs){
        if(f===g) continue;
        let atk = 0;
        for(const a of groups[f]){
          atk += powerAgainst(a, compOf[g], nd.defBonus, isSupplied(a));
        }
        dmg[g] += atk;
      }
    }
    for(const f of facs){
      const d = dmg[f] * DMG_K;
      if(d <= 0) continue;
      const g = groups[f];
      const tv = g.reduce((x,a)=>x+armyValue(a),0) || 1;
      for(const a of g){
        applyDamage(a, d * armyValue(a) / tv);
      }
    }
  }
  const before = s.armies.length;
  s.armies = s.armies.filter(a=>Object.keys(a.eq).length>0);
  if(s.armies.length !== before){
    if(s.selArmy && !s.armies.find(a=>a.id===s.selArmy)) s.selArmy = null;
  }
}

/* ============================================================
   AI
   ============================================================ */
function aiTurn(f){
  const s = state;
  const mine = s.armies.filter(a=>a.faction===f);
  const res = s.res[f];
  const myNodes = s.nodes.filter(n=>n.owner===f);
  if(!myNodes.length) return;

  if(mine.length < 3 && res >= 190){
    const nd = myNodes[Math.floor(Math.random()*myNodes.length)];
    s.res[f] -= 180;
    createArmy(f, nd.id,
      f==='ai1' ? {rifle:5, mbt:2, mg:2} : {rifle:5, atgm:2, sam:1, ifv:1},
      FAC_NAME[f]+'·新編');
    return;
  }
  if(mine.length){
    const target = mine.reduce((a,b)=>armyValue(a)<armyValue(b)?a:b);
    const pool = f==='ai1'
      ? ['mbt','spg','mlrs','rifle','mg','heli']
      : ['sam','atgm','ifv','rifle','engineer','mortar'];
    const k = pool[Math.floor(Math.random()*pool.length)];
    if(res >= EQ[k].cost){
      s.res[f] -= EQ[k].cost;
      target.eq[k] = (target.eq[k]||0)+1;
    }
  }
}

function aiMove(f){
  const s = state;
  const mine = s.armies.filter(a=>a.faction===f && a.from==null);
  if(!mine.length) return;
  const a = mine.reduce((x,y)=>armyValue(x)>armyValue(y)?x:y);
  const nbs = s.adj[a.node].filter(j=>s.nodes[j].owner!==f);
  if(!nbs.length) return;
  nbs.sort((x,y)=>{
    const nx=s.nodes[x], ny=s.nodes[y];
    const ex = nx.owner==='neutral'?0:1;
    const ey = ny.owner==='neutral'?0:1;
    if(ex!==ey) return ex-ey;
    return nx.income-ny.income;
  });
  const t = nbs[0];
  a.from = a.node; a.to = t; a.prog = 0;
  a.node = null;
}

/* ============================================================
   勝負
   ============================================================ */
function checkEnd(){
  const s = state;
  const total = s.nodes.length;
  let mine = 0;
  for(const nd of s.nodes) if(nd.owner==='player') mine++;
  if(s.nodes[s.capitals.player].owner !== 'player'){ s.gameOver='lose'; log('首都陷落，遊戲結束。','bad'); return; }
  if(mine >= Math.floor(total*0.70)){ s.gameOver='win'; log('控制 70% 領土，勝利！','good'); return; }
  const aliveAI = PLAYABLE.filter(f=>f!=='player' && s.nodes[s.capitals[f]].owner===f);
  if(!aliveAI.length){ s.gameOver='win'; log('敵方全部覆滅，勝利！','good'); }
}

/* ============================================================
   存檔
   ============================================================ */
const SAVE_KEY = 'wf_save_v2';
function saveGame(){
  try{
    const s = state;
    const data = {
      tick:s.tick, res:s.res,
      nodes:s.nodes, adj:s.adj,
      armies:s.armies, nextArmyId:s.nextArmyId,
      capitals:s.capitals, gameOver:s.gameOver
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.nodes || d.nodes.length===0) return false;
    state = {
      tick:d.tick, res:d.res, nodes:d.nodes, adj:d.adj,
      armies:d.armies, nextArmyId:d.nextArmyId,
      capitals:d.capitals,
      land:buildLand(),
      supply:{player:new Set(), ai1:new Set(), ai2:new Set()},
      selArmy:null, selNode:null,
      gameOver:d.gameOver || null,
    };
    logLines = [];
    computeSupply();
    updateCameraToPlayer();
    log('讀取存檔成功（Tick '+state.tick+'）。','good');
    return true;
  }catch(e){ return false; }
}

/* ============================================================
   世界地圖底圖渲染（深海漸變、經緯線、大陸架淺海光暈、地形紋理）
   ============================================================ */
function drawWorldBackground(s, z){
  const YS = WORLD * 0.67;
  const OFFSET_Y = (WORLD - YS) / 2;

  // 1. 統一指揮室深海藍灰漸變底色
  const [tlX, tlY] = w2s(0, OFFSET_Y);
  const [brX, brY] = w2s(WORLD, OFFSET_Y + YS);
  const oceanGrad = ctx.createRadialGradient(
    VW * 0.5, VH * 0.48, Math.min(VW, VH) * 0.08,
    VW * 0.5, VH * 0.5, Math.max(VW, VH) * 0.9
  );
  oceanGrad.addColorStop(0, '#0b1623');
  oceanGrad.addColorStop(0.6, '#08101a');
  oceanGrad.addColorStop(1, '#050a11');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, VW, VH);

  // 2. 低對比經緯網格（不搶戰術節點視覺重心）
  const [wx0, wy0] = s2w(0, 0);
  const [wx1, wy1] = s2w(VW, VH);
  const lonStep = WORLD / 12;
  const latStep = YS / 6;

  ctx.save();
  ctx.lineWidth = 1;
  for(let i=0; i<=12; i++){
    const x = i * lonStep;
    if(x < wx0 - 50 || x > wx1 + 50) continue;
    const [sx] = w2s(x, 0);
    ctx.strokeStyle = (i === 6) ? 'rgba(95,160,220,0.14)' : 'rgba(60,95,135,0.08)';
    ctx.beginPath(); ctx.moveTo(sx, Math.max(0, tlY)); ctx.lineTo(sx, Math.min(VH, brY)); ctx.stroke();
  }
  for(let j=0; j<=6; j++){
    const y = OFFSET_Y + j * latStep;
    if(y < wy0 - 50 || y > wy1 + 50) continue;
    const [, sy] = w2s(0, y);
    const isEquator = (j === 3);
    ctx.strokeStyle = isEquator ? 'rgba(95,160,220,0.18)' : 'rgba(60,95,135,0.08)';
    if(isEquator) ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(Math.max(0, tlX), sy); ctx.lineTo(Math.min(VW, brX), sy); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = 'rgba(70,115,165,0.18)';
  ctx.strokeRect(tlX, tlY, brX - tlX, brY - tlY);
  ctx.restore();

  // 3. 柔和大陸架暗藍光暈（與海面自然融合）
  for(const poly of s.land){
    const b = poly.bbox;
    const [x0,y0] = w2s(b.minX,b.minY);
    const [x1,y1] = w2s(b.maxX,b.maxY);
    if(x1<-40||y1<-40||x0>VW+40||y0>VH+40) continue;

    ctx.beginPath();
    poly.pts.forEach(([x,y],i)=>{
      const [sx,sy] = w2s(x,y);
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    });
    ctx.closePath();

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(55, 115, 165, 0.12)';
    ctx.lineWidth = Math.max(4, 12 * z);
    ctx.stroke();
    ctx.restore();
  }

  // 4. 統一石板灰藍陸地填色與細緻海岸線（襯托紅/藍/金陣營色彩）
  for(const poly of s.land){
    const b = poly.bbox;
    const [x0,y0] = w2s(b.minX,b.minY);
    const [x1,y1] = w2s(b.maxX,b.maxY);
    if(x1<0||y1<0||x0>VW||y0>VH) continue;

    ctx.beginPath();
    poly.pts.forEach(([x,y],i)=>{
      const [sx,sy] = w2s(x,y);
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    });
    ctx.closePath();

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
    ctx.shadowBlur = Math.max(4, 14 * z);
    ctx.shadowOffsetX = 2 * z;
    ctx.shadowOffsetY = 4 * z;
    const landGrad = ctx.createLinearGradient(x0, y0, x0, y1);
    landGrad.addColorStop(0, '#192634');
    landGrad.addColorStop(0.5, '#131e2a');
    landGrad.addColorStop(1, '#0e1620');
    ctx.fillStyle = landGrad;
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(110, 155, 200, 0.38)';
    ctx.lineWidth = Math.max(0.9, 1.3 * z);
    ctx.stroke();

    if(poly.label && z > 0.28 && z < 1.5){
      const cx = (x0 + x1) * 0.5;
      const cy = (y0 + y1) * 0.48;
      ctx.save();
      ctx.fillStyle = 'rgba(155, 185, 215, 0.11)';
      ctx.font = `700 ${Math.max(10, Math.round(15 * z))}px "Segoe UI",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(poly.label, cx, cy);
      ctx.restore();
    }
  }
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  const s = state;
  if(!s){
    ctx.fillStyle = '#050d14';
    ctx.fillRect(0,0,VW,VH);
    return;
  }

  const z = cam.zoom;
  drawWorldBackground(s, z);

  // 連線
  ctx.lineWidth = Math.max(0.6, 2*z);
  for(let i=0;i<s.nodes.length;i++){
    const a = s.nodes[i];
    const [ax,ay] = w2s(a.wx,a.wy);
    if(ax<-40||ax>VW+40||ay<-40||ay>VH+40) continue;
    for(const j of s.adj[i]){
      if(j < i) continue;
      const b = s.nodes[j];
      const [bx,by] = w2s(b.wx,b.wy);
      const same = a.owner===b.owner && a.owner!=='neutral';
      const fed = same && s.supply[a.owner] && s.supply[a.owner].has(i) && s.supply[a.owner].has(j);
      ctx.strokeStyle = same
        ? (fed ? hexA(FAC_COLOR[a.owner],0.65) : hexA(FAC_COLOR[a.owner],0.22))
        : 'rgba(70,90,110,0.35)';
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    }
  }

  // 節點
  const R = Math.max(2.4, 9.5*z);
  const moveSet = new Set();
  if(s.selArmy){
    const a = s.armies.find(x=>x.id===s.selArmy);
    if(a && a.from==null){ for(const j of s.adj[a.node]) moveSet.add(j); }
  }

  for(const nd of s.nodes){
    const [x,y] = w2s(nd.wx, nd.wy);
    if(x<-30||x>VW+30||y<-30||y>VH+30) continue;
    const col = FAC_COLOR[nd.owner];
    const supplied = nd.owner!=='neutral' && s.supply[nd.owner] && s.supply[nd.owner].has(nd.id);

    if(moveSet.has(nd.id)){
      ctx.beginPath(); ctx.arc(x,y,R+5,0,Math.PI*2);
      ctx.strokeStyle = 'rgba(110,220,150,0.85)';
      ctx.lineWidth = 1.8; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    }

    if(nd.owner!=='neutral'){
      const g = ctx.createRadialGradient(x,y,R*0.2,x,y,R*2.0);
      g.addColorStop(0, hexA(col, supplied?0.40:0.15));
      g.addColorStop(1, hexA(col,0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,R*2.0,0,Math.PI*2); ctx.fill();
    }

    ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2);
    ctx.fillStyle = nd.owner==='neutral' ? '#0f1720' : hexA(col, supplied?0.95:0.45);
    ctx.fill();
    ctx.lineWidth = nd.id===s.selNode ? 2.4 : Math.max(0.8, 1.3*z);
    ctx.strokeStyle = nd.id===s.selNode ? '#ffffff' : (nd.owner==='neutral' ? '#2b3946' : col);
    ctx.stroke();

    if(z > 0.55){
      ctx.fillStyle = 'rgba(215,230,245,0.92)';
      ctx.font = Math.max(8, 10*z)+'px "Microsoft JhengHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(nd.name, x, y+R+2);
    }
  }

  // 軍隊
  const nodeArmies = {};
  for(const a of s.armies){
    if(a.from==null) (nodeArmies[a.node] ||= []).push(a);
  }
  for(const nid in nodeArmies){
    const list = nodeArmies[nid];
    const n = s.nodes[nid];
    const [nx,ny] = w2s(n.wx,n.wy);
    const cnt = list.length;
    list.forEach((a,i)=>{
      const ang = -Math.PI/2 + (i - (cnt-1)/2) * 0.72;
      const rad = R + Math.max(7, 13*z);
      const x = nx + Math.cos(ang)*rad;
      const y = ny + Math.sin(ang)*rad;
      drawArmyToken(a, x, y, z, a.id===s.selArmy);
    });
  }
  for(const a of s.armies){
    if(a.from==null) continue;
    const [wx,wy] = armyPos(a);
    const [x,y] = w2s(wx,wy);
    drawArmyToken(a, x, y, z, a.id===s.selArmy);
    const A = s.nodes[a.from], B = s.nodes[a.to];
    const [ax,ay] = w2s(A.wx,A.wy);
    const [bx,by] = w2s(B.wx,B.wy);
    ctx.strokeStyle = hexA(FAC_COLOR[a.faction],0.55);
    ctx.lineWidth = 1.8; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.setLineDash([]);
  }

  drawMinimap();
}

function drawArmyToken(a, x, y, z, selected){
  const col = FAC_COLOR[a.faction];
  const sz = Math.max(3.5, 7*z + Math.min(6, armyUnits(a)*0.3*z));
  ctx.save();
  ctx.translate(x,y);
  ctx.beginPath();
  ctx.moveTo(0,-sz); ctx.lineTo(sz*0.86,sz*0.62); ctx.lineTo(-sz*0.86,sz*0.62);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.globalAlpha = 0.95;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = selected ? 2.2 : 0.9;
  ctx.strokeStyle = selected ? '#ffffff' : '#0a1016';
  ctx.stroke();
  if(!isSupplied(a) && a.from==null){
    ctx.beginPath(); ctx.arc(0,0,sz*1.7,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(255,90,90,0.75)';
    ctx.lineWidth = 1.2; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawMinimap(){
  const W = Math.min(180, VW*0.22);
  const H = Math.round(W * 0.75);
  const pad = 12;
  const ox = VW - W - pad, oy = VH - H - pad;
  const sc = W / WORLD;

  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = 'rgba(8,14,20,0.9)';
  ctx.fillRect(ox,oy,W,H);
  ctx.strokeStyle = '#22313f';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox+0.5,oy+0.5,W-1,H-1);

  for(const poly of state.land){
    ctx.beginPath();
    poly.pts.forEach(([x,y],i)=>{
      const sx = ox + x*sc;
      const sy = oy + (y - (WORLD - WORLD*0.67)/2)*sc / 0.67;
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(35,52,70,0.85)';
    ctx.fill();
  }

  for(const nd of state.nodes){
    const x = ox + nd.wx*sc;
    const y = oy + (nd.wy - (WORLD - WORLD*0.67)/2)*sc / 0.67;
    ctx.fillStyle = FAC_COLOR[nd.owner];
    ctx.globalAlpha = nd.owner==='neutral' ? 0.35 : 0.9;
    ctx.fillRect(x-1, y-1, 2, 2);
  }
  ctx.globalAlpha = 1;

  const [vx0,vy0] = s2w(0,0);
  const [vx1,vy1] = s2w(VW,VH);
  ctx.strokeStyle = '#7cc4ff';
  ctx.lineWidth = 1.4;
  ctx.strokeRect(
    ox+vx0*sc, 
    oy+(vy0 - (WORLD - WORLD*0.67)/2)*sc / 0.67, 
    (vx1-vx0)*sc, 
    (vy1-vy0)*sc / 0.67
  );
  ctx.restore();
}

/* ============================================================
   互動：滑鼠
   ============================================================ */
let lastTouchTime = 0;
let drag = null;

cv.addEventListener('mousedown', e=>{
  if(Date.now() - lastTouchTime < 700) return;
  if(e.button===2) return;
  const r = cv.getBoundingClientRect();
  drag = {sx:e.clientX-r.left, sy:e.clientY-r.top, cx:cam.x, cy:cam.y, moved:false};
  cv.classList.add('drag');
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  const r = cv.getBoundingClientRect();
  const dx = (e.clientX-r.left) - drag.sx;
  const dy = (e.clientY-r.top) - drag.sy;
  if(Math.abs(dx)+Math.abs(dy) > 4) drag.moved = true;
  if(drag.moved){
    cam.x = drag.cx - dx/cam.zoom;
    cam.y = drag.cy - dy/cam.zoom;
  }
});
window.addEventListener('mouseup', ()=>{
  if(!drag) return;
  cv.classList.remove('drag');
  if(!drag.moved) handleClick(drag.sx, drag.sy);
  drag = null;
});
cv.addEventListener('contextmenu', e=>{
  e.preventDefault();

if(state){ state.selArmy = null; state.selNode = null; rebuildSidebar(); }
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const [wx,wy] = s2w(sx,sy);
  const factor = e.deltaY < 0 ? 1.14 : 1/1.14;
  cam.zoom = clamp(cam.zoom*factor, ZMIN, ZMAX);
  const [nx,ny] = s2w(sx,sy);
  cam.x += wx-nx;
  cam.y += wy-ny;
}, {passive:false});

/* ============================================================
   互動：觸控
   ============================================================ */
let touch = null;

function tPos(t){
  const r = cv.getBoundingClientRect();
  return [t.clientX - r.left, t.clientY - r.top];
}

cv.addEventListener('touchstart', e=>{
  lastTouchTime = Date.now();
  e.preventDefault();
  if(e.touches.length === 1){
    const [x,y] = tPos(e.touches[0]);
    touch = {mode:'drag', sx:x, sy:y, cx:cam.x, cy:cam.y, moved:false};
  } else if(e.touches.length === 2){
    const [x1,y1] = tPos(e.touches[0]);
    const [x2,y2] = tPos(e.touches[1]);
    touch = {
      mode:'pinch',
      lastDist: Math.hypot(x2-x1, y2-y1),
      lastMidX: (x1+x2)/2,
      lastMidY: (y1+y2)/2,
    };
  }
}, {passive:false});

cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!touch) return;

  if(touch.mode === 'drag' && e.touches.length === 1){
    const [x,y] = tPos(e.touches[0]);
    const dx = x - touch.sx;
    const dy = y - touch.sy;
    if(Math.abs(dx)+Math.abs(dy) > 5) touch.moved = true;
    if(touch.moved){
      cam.x = touch.cx - dx/cam.zoom;
      cam.y = touch.cy - dy/cam.zoom;
    }
    return;
  }

  if(touch.mode === 'pinch' && e.touches.length === 2){
    const [x1,y1] = tPos(e.touches[0]);
    const [x2,y2] = tPos(e.touches[1]);
    const dist = Math.hypot(x2-x1, y2-y1);
    const midX = (x1+x2)/2;
    const midY = (y1+y2)/2;

    if(touch.lastDist > 0 && dist > 0){
      const scale = dist / touch.lastDist;
      const newZoom = clamp(cam.zoom * scale, ZMIN, ZMAX);

      const [wx, wy] = s2w(midX, midY);
      cam.zoom = newZoom;
      const [nx, ny] = s2w(midX, midY);
      cam.x += wx - nx;
      cam.y += wy - ny;

      const dmx = midX - touch.lastMidX;
      const dmy = midY - touch.lastMidY;
      cam.x -= dmx / cam.zoom;
      cam.y -= dmy / cam.zoom;
    }

    touch.lastDist = dist;
    touch.lastMidX = midX;
    touch.lastMidY = midY;
  }
}, {passive:false});

cv.addEventListener('touchend', e=>{
  e.preventDefault();
  if(!touch) return;

  if(touch.mode === 'drag' && !touch.moved){
    handleClick(touch.sx, touch.sy);
  }

  if(e.touches.length === 1 && touch.mode === 'pinch'){
    const [x,y] = tPos(e.touches[0]);
    touch = {mode:'drag', sx:x, sy:y, cx:cam.x, cy:cam.y, moved:true};
  } else if(e.touches.length === 0){
    touch = null;
  }
}, {passive:false});

cv.addEventListener('touchcancel', e=>{
  e.preventDefault();
  touch = null;
}, {passive:false});

document.addEventListener('gesturestart', e=>e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e=>e.preventDefault(), {passive:false});
document.addEventListener('gestureend', e=>e.preventDefault(), {passive:false});

/* ============================================================
   點擊處理
   ============================================================ */
function handleClick(sx, sy){
  const s = state;
  if(!s) return;

  let hitArmy = null, bestD = 22;
  for(const a of s.armies){
    const [wx,wy] = armyPos(a);
    const [x,y] = w2s(wx,wy);
    const d = Math.hypot(x-sx, y-sy);
    if(d < bestD){ bestD = d; hitArmy = a; }
  }

  let hitNode = null, nd2 = Infinity;
  for(const nd of s.nodes){
    const [x,y] = w2s(nd.wx, nd.wy);
    const d = Math.hypot(x-sx, y-sy);
    const R = Math.max(9, 18*cam.zoom);
    if(d < R && d < nd2){ nd2 = d; hitNode = nd; }
  }

  const sel = s.selArmy ? s.armies.find(a=>a.id===s.selArmy) : null;

  if(hitArmy){
    if(sel && hitArmy.id !== sel.id && sel.faction===hitArmy.faction
       && sel.faction==='player'
       && sel.from==null && hitArmy.from==null && sel.node===hitArmy.node){
      mergeArmies(sel, hitArmy);
      return;
    }
    s.selArmy = hitArmy.id;
    s.selNode = null;
    rebuildSidebar();
    return;
  }

  if(hitNode){
    if(sel && sel.faction==='player' && sel.from==null && s.adj[sel.node].includes(hitNode.id)){
      sel.from = sel.node;
      sel.to = hitNode.id;
      sel.prog = 0;
      sel.node = null;
      log(`「${sel.name}」向 ${hitNode.name} 移動。`);
      rebuildSidebar();
      return;
    }
    s.selNode = hitNode.id;
    s.selArmy = null;
    rebuildSidebar();
    return;
  }

  s.selArmy = null; s.selNode = null;
  rebuildSidebar();
}

function mergeArmies(a, b){
  if(a.faction !== 'player' || b.faction !== 'player') return;
  for(const k in b.eq) a.eq[k] = (a.eq[k]||0) + b.eq[k];
  state.armies = state.armies.filter(x=>x.id!==b.id);
  log(`「${b.name}」併入「${a.name}」。`, 'good');
  rebuildSidebar();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function rebuildSidebar(){
  const s = state;
  if(!s) return;

  const mine = s.armies.filter(a=>a.faction==='player');
  $('armyList').innerHTML = mine.length
    ? mine.map(a=>{
        const units = armyUnits(a);
        const loc = a.from==null ? s.nodes[a.node].name : '移動中';
        const supplyBad = a.from==null && !isSupplied(a) ? ' ⚠' : '';
        return `<div class="army-item ${a.id===s.selArmy?'sel':''}" data-army="${a.id}">
          <span class="fac" style="background:${FAC_COLOR[a.faction]}"></span>
          <span class="nm">${escapeHtml(a.name)}</span>
          <span class="sz">${units}件 · ${loc}${supplyBad}</span>
        </div>`;
      }).join('')
    : '<div style="color:#5a6b7b;font-size:11px">尚無部隊，請先佔領節點以獲得收入。</div>';

  const sel = s.selArmy ? s.armies.find(a=>a.id===s.selArmy) : null;
  const selN = s.selNode!=null ? s.nodes[s.selNode] : null;

  if(sel){
    const isPlayer = sel.faction === 'player';
    const eqRows = Object.keys(sel.eq).filter(k=>sel.eq[k]>0).map(k=>{
      const e = EQ[k];
      let btns = '';
      if(isPlayer){
        btns = `<button class="mini" data-splitone="${sel.id}:${k}">拆1</button>
                <button class="mini" data-sellone="${sel.id}:${k}">賣</button>`;
      }
      return `<div class="eq-row">
        <span class="eq-name">${e.name}</span>
        <span class="eq-cnt">×${sel.eq[k]}</span>
        ${btns}
      </div>`;
    }).join('') || '<div style="color:#5a6b7b;font-size:11px">空部隊</div>';

    const loc = sel.from==null ? s.nodes[sel.node].name : '移動中';
    const supplyTxt = sel.from==null
      ? (isSupplied(sel) ? '<span class="tag">補給正常</span>' : '<span class="tag" style="background:#5c2323;color:#ff9a9a">補給中斷</span>')
      : '<span class="tag">行軍中</span>';

    let headerHtml = `<div class="row"><b>${escapeHtml(sel.name)}</b>`;
    if(isPlayer) headerHtml += `<button class="mini" data-rename="${sel.id}">改名</button>`;
    headerHtml += `</div>`;

    let splitAllHtml = '';
    if(isPlayer) {
      splitAllHtml = `<div class="row" style="margin-top:7px"><button class="mini" data-splitall="${sel.id}">全部拆出新部隊</button></div>`;
    }

    $('selPanel').innerHTML = `
      ${headerHtml}
      <div class="row" style="font-size:11px;color:#7d93a8">
        <span>位置：${loc}</span>${supplyTxt}
      </div>
      <div class="row" style="font-size:11px;color:#7d93a8">
        <span>陣營：${FAC_NAME[sel.faction]}</span>
        <span>總價值：${armyValue(sel)}</span>
        <span>單位：${armyUnits(sel)}</span>
      </div>
      <div style="margin-top:6px;border-top:1px solid #16202b;padding-top:5px">${eqRows}</div>
      ${splitAllHtml}
    `;
  } else if(selN){
    const ownerTag = `<span class="tag ${selN.owner==='player'?'p':selN.owner==='ai1'?'a1':selN.owner==='ai2'?'a2':'n'}">${FAC_NAME[selN.owner]}</span>`;
    const terrName = {city:'城市',mountain:'山地',coast:'海岸',plain:'平原'}[selN.terrain];
    const armiesHere = s.armies.filter(a=>a.from==null && a.node===selN.id);
    const listHtml = armiesHere.length
      ? armiesHere.map(a=>`<div class="row" style="font-size:11px">
          <span style="color:${FAC_COLOR[a.faction]}">▲</span>
          <span style="flex:1">${escapeHtml(a.name)}</span>
          <span style="color:#7d93a8">${armyUnits(a)}件</span>
        </div>`).join('')
      : '<div style="color:#5a6b7b;font-size:11px">無駐軍</div>';
    $('selPanel').innerHTML = `
      <div class="row"><b>${selN.name}</b>${ownerTag}</div>
      <div class="row" style="font-size:11px;color:#7d93a8"><span>地形：${terrName}</span><span>收入：${selN.income}/tick</span></div>
      <div class="row" style="font-size:11px;color:#7d93a8"><span>防禦加成：${(selN.defBonus*100).toFixed(0)}%</span></div>
      <div style="margin-top:6px;border-top:1px solid #16202b;padding-top:5px">${listHtml}</div>
      ${selN.owner==='player' ? `<div class="row" style="margin-top:7px"><button class="mini pri" data-newarmy="${selN.id}">在此新建部隊</button></div>` : ''}
    `;
  } else {
    $('selPanel').innerHTML = '<div style="color:#5a6b7b;font-size:11px">點擊地圖上的軍隊或節點。</div>';
  }

  updateShopState();
  updateTopbar();
}

function buildShopOnce(){
  const shop = $('shop');
  shop.innerHTML = EQ_KEYS.map(k=>{
    const e = EQ[k];
    return `<button class="shop-btn" data-eq="${k}">
      <span class="n">${e.name}</span><span class="c">${e.cost}</span>
    </button>`;
  }).join('');
  shop.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-eq]');
    if(!btn || btn.classList.contains('dis')) return;
    buyEq(btn.dataset.eq);
  });
}

function updateShopState(){
  const s = state;
  if(!s) return;
  const shop = $('shop');
  if(!shop || shop.children.length === 0) return;
  const a = s.selArmy ? s.armies.find(x=>x.id===s.selArmy) : null;
  const canBuyBase = a && a.faction==='player' && a.from==null;
  for(const btn of shop.children){
    const e = EQ[btn.dataset.eq];
    const can = canBuyBase && s.res.player >= e.cost;
    btn.classList.toggle('dis', !can);
  }
}

document.getElementById('sidebar').addEventListener('click', e=>{
  const t = e.target;
  const armyItem = t.closest('[data-army]');
  if(armyItem){ selectArmy(parseInt(armyItem.dataset.army,10)); return; }
  const rn = t.closest('[data-rename]');

  const so = t.closest('[data-splitone]');
  if(so){

  if(sl){
    const [id,k] = sl.dataset.sellone.split(':');
    sellOne(parseInt(id,10), k); return;
  }
  const sa = t.closest('[data-splitall]');
  if(sa){ splitAll(parseInt(sa.dataset.splitall,10)); return; }
  const na = t.closest('[data-newarmy]');
  if(na){ newArmyHere(parseInt(na.dataset.newarmy,10)); return; }
});

function updateTopbar(){
  const s = state;
  if(!s) return;
  $('uiRes').textContent = Math.floor(s.res.player);
  $('uiTick').textContent = s.tick;
  let mine = 0;
  for(const nd of s.nodes) if(nd.owner==='player') mine++;
  $('uiNodes').textContent = mine;

    ? (s.gameOver==='win' ? '勝利' : '失敗')
    : (paused ? '已暫停' : '');
  $('uiStatus').style.color = s.gameOver==='win' ? '#5fd08a' : s.gameOver==='lose' ? '#ff6b6b' : '#8fa3b8';

/* ============================================================
   UI 動作
   ============================================================ */
function selectArmy(id){
  state.selArmy = id; state.selNode = null; rebuildSidebar();
}

function renameArmy(id){
  const a = state.armies.find(x=>x.id===id);
  if(!a || a.faction !== 'player') return;
  const panel = $('selPanel');
  if(!panel) return;
  const existing = document.getElementById('inlineRenameBox');
  if(existing){ existing.remove(); return; }
  const box = document.createElement('div');
  box.id = 'inlineRenameBox';
  box.className = 'row';
  box.style.marginTop = '5px';
  box.innerHTML = `<input id="inlineRenameVal" type="text" maxlength="24" value="${escapeHtml(a.name)}" style="flex:1;background:#081018;color:#fff;border:1px solid #2e79b8;border-radius:3px;padding:2px 6px;font-size:11px"><button class="mini pri" id="inlineRenameOk">確定</button>`;
  panel.prepend(box);
  document.getElementById('inlineRenameOk').onclick = () => {
    const val = (document.getElementById('inlineRenameVal').value || '').trim();
    if(val){ a.name = val.slice(0,24); saveGame(); }
    rebuildSidebar();
  };
}

let _uiRefreshPending = false;
function scheduleUIRefresh(){
  if(_uiRefreshPending) return;
  _uiRefreshPending = true;
  requestAnimationFrame(()=>{
    _uiRefreshPending = false;
    rebuildSidebar();
  });
}

function buyEq(k){
  const s = state;
  const a = s.selArmy ? s.armies.find(x=>x.id===s.selArmy) : null;
  if(!a || a.faction!=='player'){ log('只能對己方部隊補給。','warn'); return; }
  if(a.from!=null){ log('行軍中無法補給裝備。','warn'); return; }
  const cost = EQ[k].cost;
  if(s.res.player < cost){ log('資源不足。','warn'); return; }
  s.res.player -= cost;
  a.eq[k] = (a.eq[k]||0)+1;
  updateShopState();
  updateTopbar();
  scheduleUIRefresh();
}

function sellOne(id, k){
  const a = state.armies.find(x=>x.id===id);
  if(!a || a.faction !== 'player' || !a.eq[k]) return;
  a.eq[k]--;
  if(a.eq[k]<=0) delete a.eq[k];
  state.res.player += Math.floor(EQ[k].cost*0.5);
  if(!Object.keys(a.eq).length) state.armies = state.armies.filter(x=>x.id!==id);
  rebuildSidebar();
}

function splitOne(id, k){
  const s = state;
  const a = s.armies.find(x=>x.id===id);
  if(!a || a.faction !== 'player' || !a.eq[k] || a.from!=null) return;
  a.eq[k]--;
  if(a.eq[k]<=0) delete a.eq[k];
  if(!Object.keys(a.eq).length) s.armies = s.armies.filter(x=>x.id!==id);
  const na = createArmy('player', a.node, {[k]:1}, '新編分隊');
  s.selArmy = na.id;
  log(`從「${a.name}」拆出「${na.name}」。`);
  rebuildSidebar();
}

function splitAll(id){
  const s = state;
  const a = s.armies.find(x=>x.id===id);
  if(!a || a.faction !== 'player' || a.from!=null) return;
  if(armyUnits(a) <= 1){ log('部隊太小，無需拆分。','warn'); return; }
  const half = {};
  let moved = 0;
  for(const k in a.eq){
    const take = Math.floor(a.eq[k]/2);
    if(take > 0){ half[k] = take; a.eq[k] -= take; moved += take; if(a.eq[k]<=0) delete a.eq[k]; }
  }
  if(!moved){ log('無法拆分。','warn'); return; }
  const na = createArmy('player', a.node, half, '新編分隊');
  s.selArmy = na.id;
  log(`「${a.name}」拆出一半兵力成「${na.name}」。`);
  rebuildSidebar();
}

function newArmyHere(nodeId){
  const s = state;
  const nd = s.nodes[nodeId];
  if(nd.owner !== 'player') return;
  if(s.res.player < 40){ log('資源不足（需 40）。','warn'); return; }
  s.res.player -= 40;
  const na = createArmy('player', nodeId, {rifle:3, mg:1}, '新編連隊');
  s.selArmy = na.id;
  log(`在 ${nd.name} 組建「${na.name}」。`,'good');
  rebuildSidebar();
}

/* ============================================================
   主循環
   ============================================================ */
let acc = 0, lastTs = 0;

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  const dt = ts - lastTs;
  lastTs = ts;

  if(state && !paused && !state.gameOver){
    acc += dt;
    let guard = 0;
    while(acc >= TICK_MS && guard++ < 4){
      acc -= TICK_MS;
      doTick();
    }
  }
  render();

  if(!loop._lastUi || Date.now() - loop._lastUi > 1000){
    loop._lastUi = Date.now();
    if(state) rebuildSidebar();
  }
}

/* ============================================================
   按鈕
   ============================================================ */
$('btnPause').addEventListener('click', ()=>{
  paused = !paused;
  $('btnPause').textContent = paused ? '繼續' : '暫停';
  updateTopbar();
});
let _confirmNewTimer = null;
$('btnNew').addEventListener('click', ()=>{
  const btn = $('btnNew');
  if(btn.dataset.arm !== '1'){
    btn.dataset.arm = '1';
    btn.textContent = '確定重開?';
    clearTimeout(_confirmNewTimer);
    _confirmNewTimer = setTimeout(()=>{ btn.dataset.arm=''; btn.textContent='新遊戲'; }, 3000);
    return;
  }
  btn.dataset.arm = '';
  btn.textContent = '新遊戲';
  clearTimeout(_confirmNewTimer);
  newGame();
  rebuildSidebar();
  paused = false;
  $('btnPause').textContent = '暫停';
});

/* ============================================================
   啟動
   ============================================================ */
(function boot(){
  resize();
  buildShopOnce();
  const ok = loadGame();
  if(!ok) newGame();
  rebuildSidebar();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
